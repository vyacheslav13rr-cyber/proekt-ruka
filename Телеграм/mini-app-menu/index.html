<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню бота РУКА</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --navy: #17212b; --tile: #232e3c; --gold: #c9a24b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 18px 14px 28px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, var(--navy));
    color: var(--tg-theme-text-color, #fff);
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 4px 0 16px;
    text-align: center;
    color: var(--tg-theme-hint-color, #8fa3b8);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card {
    background: var(--tg-theme-secondary-bg-color, var(--tile));
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }
  .card:active { opacity: 0.65; }
  .icon-badge {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 12px;
    background: rgba(201, 162, 75, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--tg-theme-text-color, #fff);
  }
</style>
</head>
<body>
  <h1>Меню бота РУКА</h1>
  <div class="grid">
    <div class="card" data-action="new_topic">
      <div class="icon-badge">📝</div>
      <div class="label">Новая<br>тема</div>
    </div>
    <div class="card" data-action="new_post">
      <div class="icon-badge">🆕</div>
      <div class="label">Создать<br>пост</div>
    </div>
    <div class="card" data-action="topics">
      <div class="icon-badge">📋</div>
      <div class="label">Темы</div>
    </div>
    <div class="card" data-action="schedule">
      <div class="icon-badge">📅</div>
      <div class="label">Расписание</div>
    </div>
  </div>
  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    document.querySelectorAll('.card').forEach(function (card) {
      card.addEventListener('click', function () {
        var action = card.getAttribute('data-action');
        if (tg && tg.sendData) {
          tg.sendData(JSON.stringify({ action: action }));
        }
      });
    });
  </script>
</body>
</html>
